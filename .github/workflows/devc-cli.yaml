on:
  workflow_dispatch:
jobs:
  build:
    runs-on: 
      - ech00s-runner
    steps:
      - name: checkout
        uses: actions/checkout@v6
      
      - name: login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
      - name: build-cli
        run: docker build -t ech00s/devc-cli:alpha0.2.0 -f devc-image/Dockerfile .
      
      - name: push-cli
        run: docker push ech00s/devc-cli:alpha0.2.0